name: ARM-CRM tests and build
on:
  push:
    branches:
      - main
      - feat/stech-arm-crm-foundation-20261102
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Automated tests
        run: npm test
      - name: Production build
        run: npm run build
